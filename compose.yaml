name: fvdms

services:
  app:
    build:
      context: .
      target: development
    container_name: fvdms
    restart: unless-stopped
    environment:
      FVDMS_CONTAINER: '1'
      PNPM_CONFIG_STORE_DIR: /pnpm/store
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_HOST: mysql
      DATABASE_PORT: '3306'
      DATABASE_NAME: fvdms
      DATABASE_USER: fvdms_app
      DATABASE_PASSWORD: local-fvdms-app-password
      DATABASE_POOL_MIN: '1'
      DATABASE_POOL_MAX: '10'
      DATABASE_CONNECT_TIMEOUT_MS: '5000'
      DATABASE_QUERY_TIMEOUT_MS: '2000'
      REPORTING_DATABASE_HOST: mysql
      REPORTING_DATABASE_PORT: '3306'
      REPORTING_DATABASE_NAME: fvdms
      REPORTING_DATABASE_USER: fvdms_reporter
      REPORTING_DATABASE_PASSWORD: local-fvdms-reporter-password
      REPORTING_DATABASE_POOL_MIN: '0'
      REPORTING_DATABASE_POOL_MAX: '3'
      REPORTING_DATABASE_CONNECT_TIMEOUT_MS: '5000'
      REPORTING_DATABASE_QUERY_TIMEOUT_MS: '10000'
      REPORTING_ALLOW_WRITER_ALIAS: 'false'
      REPORT_EXPORT_STORAGE_ROOT: /var/lib/fvdms/exports
      REPORT_EXPORT_POLL_INTERVAL_MS: '1000'
      REPORT_EXPORT_SYNC_ROW_LIMIT: '1000'
      REPORT_EXPORT_MAX_ROWS: '100000'
      REPORT_EXPORT_MAX_BYTES: '52428800'
      REPORT_EXPORT_TIMEOUT_MS: '900000'
      REPORT_EXPORT_LEASE_MS: '960000'
      REPORT_EXPORT_RETENTION_SECONDS: '604800'
      REPORT_EXPORT_TOKEN_TTL_SECONDS: '300'
      REPORT_EXPORT_STALE_TEMP_SECONDS: '3600'
      AUDIT_DATABASE_NAME: fvdms_audit
      AUDIT_SINK_DATABASE_NAME: fvdms_audit_sink
      AUDIT_MAX_CANONICAL_PAYLOAD_BYTES: '65536'
      AUDIT_CHAIN_BATCH_SIZE: '100'
      AUDIT_SINK_BATCH_SIZE: '100'
      AUDIT_POLL_INTERVAL_MS: '1000'
      AUDIT_RETRY_BASE_MS: '1000'
      AUDIT_RETRY_MAX_MS: '60000'
      AUDIT_VERIFICATION_PAGE_SIZE: '500'
      AUTH_ALLOWED_ORIGIN: https://fvdms.lan
      AUTH_STANDARD_IDLE_TIMEOUT_SECONDS: '1800'
      AUTH_PRIVILEGED_IDLE_TIMEOUT_SECONDS: '900'
      AUTH_ABSOLUTE_TIMEOUT_SECONDS: '28800'
      AUTH_PRIVILEGED_SESSION_LIMIT: '1'
      AUTH_RATE_LIMIT_MAX_FAILURES: '5'
      AUTH_RATE_LIMIT_WINDOW_SECONDS: '900'
      AUTH_RATE_LIMIT_LOCK_SECONDS: '900'
      AUTH_CHALLENGE_TTL_SECONDS: '300'
      AUTH_ACTIVITY_WRITE_INTERVAL_SECONDS: '300'
      AUTH_PASSWORD_MIN_LENGTH: '12'
      AUTH_PASSWORD_MAX_LENGTH: '128'
      AUTH_TOTP_ACTIVE_KEY_VERSION: '1'
      # Development-only keys. Never copy these values into a deployed environment.
      AUTH_TOTP_ENCRYPTION_KEYS: '{"1":"MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="}'
      AUTH_RATE_LIMIT_HMAC_KEY: YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk=
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - pnpm-store:/pnpm/store
      - next-cache:/app/.next
      - report-exports:/var/lib/fvdms/exports
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=dev-net'
      - 'traefik.http.routers.fvdms.rule=Host(`fvdms.lan`)'
      - 'traefik.http.routers.fvdms.entrypoints=websecure'
      - 'traefik.http.routers.fvdms.tls=true'
      - 'traefik.http.routers.fvdms.service=fvdms'
      - 'traefik.http.services.fvdms.loadbalancer.server.port=3000'
    networks:
      - dev-net

  reporting-worker:
    build:
      context: .
      target: development
    container_name: fvdms-reporting-worker
    restart: unless-stopped
    command: ['./scripts/reporting/worker.sh']
    depends_on:
      app:
        condition: service_healthy
    environment:
      FVDMS_CONTAINER: '1'
      PNPM_CONFIG_STORE_DIR: /pnpm/store
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_HOST: mysql
      DATABASE_PORT: '3306'
      DATABASE_NAME: fvdms
      DATABASE_USER: fvdms_app
      DATABASE_PASSWORD: local-fvdms-app-password
      DATABASE_POOL_MIN: '0'
      DATABASE_POOL_MAX: '4'
      DATABASE_CONNECT_TIMEOUT_MS: '5000'
      DATABASE_QUERY_TIMEOUT_MS: '2000'
      REPORTING_DATABASE_HOST: mysql
      REPORTING_DATABASE_PORT: '3306'
      REPORTING_DATABASE_NAME: fvdms
      REPORTING_DATABASE_USER: fvdms_reporter
      REPORTING_DATABASE_PASSWORD: local-fvdms-reporter-password
      REPORTING_DATABASE_POOL_MIN: '0'
      REPORTING_DATABASE_POOL_MAX: '3'
      REPORTING_DATABASE_CONNECT_TIMEOUT_MS: '5000'
      REPORTING_DATABASE_QUERY_TIMEOUT_MS: '10000'
      REPORTING_ALLOW_WRITER_ALIAS: 'false'
      REPORT_EXPORT_STORAGE_ROOT: /var/lib/fvdms/exports
      REPORT_EXPORT_POLL_INTERVAL_MS: '1000'
      REPORT_EXPORT_SYNC_ROW_LIMIT: '1000'
      REPORT_EXPORT_MAX_ROWS: '100000'
      REPORT_EXPORT_MAX_BYTES: '52428800'
      REPORT_EXPORT_TIMEOUT_MS: '900000'
      REPORT_EXPORT_LEASE_MS: '960000'
      REPORT_EXPORT_RETENTION_SECONDS: '604800'
      REPORT_EXPORT_TOKEN_TTL_SECONDS: '300'
      REPORT_EXPORT_STALE_TEMP_SECONDS: '3600'
      AUDIT_DATABASE_NAME: fvdms_audit
      AUDIT_SINK_DATABASE_NAME: fvdms_audit_sink
      AUDIT_MAX_CANONICAL_PAYLOAD_BYTES: '65536'
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - pnpm-store:/pnpm/store
      - report-exports:/var/lib/fvdms/exports
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
    networks:
      - dev-net

  audit-worker:
    build:
      context: .
      target: development
    container_name: fvdms-audit-worker
    restart: unless-stopped
    command: ['./scripts/audit/worker.sh']
    environment:
      FVDMS_CONTAINER: '1'
      PNPM_CONFIG_STORE_DIR: /pnpm/store
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_HOST: mysql
      DATABASE_PORT: '3306'
      DATABASE_NAME: fvdms
      DATABASE_USER: fvdms_audit_worker
      DATABASE_PASSWORD: local-fvdms-audit-worker-password
      DATABASE_POOL_MIN: '1'
      DATABASE_POOL_MAX: '4'
      DATABASE_CONNECT_TIMEOUT_MS: '5000'
      DATABASE_QUERY_TIMEOUT_MS: '2000'
      AUDIT_DATABASE_NAME: fvdms_audit
      AUDIT_SINK_HOST: mysql
      AUDIT_SINK_PORT: '3306'
      AUDIT_SINK_DATABASE_NAME: fvdms_audit_sink
      AUDIT_WORKER_DATABASE_USER: fvdms_audit_worker
      AUDIT_WORKER_DATABASE_PASSWORD: local-fvdms-audit-worker-password
      AUDIT_SINK_DATABASE_USER: fvdms_audit_sink_writer
      AUDIT_SINK_DATABASE_PASSWORD: local-fvdms-audit-sink-writer-password
      AUDIT_MAX_CANONICAL_PAYLOAD_BYTES: '65536'
      AUDIT_CHAIN_BATCH_SIZE: '100'
      AUDIT_SINK_BATCH_SIZE: '100'
      AUDIT_POLL_INTERVAL_MS: '1000'
      AUDIT_RETRY_BASE_MS: '1000'
      AUDIT_RETRY_MAX_MS: '60000'
      AUDIT_VERIFICATION_PAGE_SIZE: '500'
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - pnpm-store:/pnpm/store
    networks:
      - dev-net

  audit-verifier:
    profiles: [tools]
    build:
      context: .
      target: development
    command: ['./scripts/audit/verify.sh']
    environment:
      FVDMS_CONTAINER: '1'
      PNPM_CONFIG_STORE_DIR: /pnpm/store
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_HOST: mysql
      DATABASE_PORT: '3306'
      DATABASE_NAME: fvdms
      DATABASE_USER: fvdms_audit_verifier
      DATABASE_PASSWORD: local-fvdms-audit-verifier-password
      DATABASE_POOL_MIN: '1'
      DATABASE_POOL_MAX: '2'
      DATABASE_CONNECT_TIMEOUT_MS: '5000'
      DATABASE_QUERY_TIMEOUT_MS: '2000'
      AUDIT_DATABASE_NAME: fvdms_audit
      AUDIT_SINK_HOST: mysql
      AUDIT_SINK_PORT: '3306'
      AUDIT_SINK_DATABASE_NAME: fvdms_audit_sink
      AUDIT_VERIFIER_DATABASE_USER: fvdms_audit_verifier
      AUDIT_VERIFIER_DATABASE_PASSWORD: local-fvdms-audit-verifier-password
      AUDIT_MAX_CANONICAL_PAYLOAD_BYTES: '65536'
      AUDIT_CHAIN_BATCH_SIZE: '100'
      AUDIT_SINK_BATCH_SIZE: '100'
      AUDIT_POLL_INTERVAL_MS: '1000'
      AUDIT_RETRY_BASE_MS: '1000'
      AUDIT_RETRY_MAX_MS: '60000'
      AUDIT_VERIFICATION_PAGE_SIZE: '500'
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - pnpm-store:/pnpm/store
    networks:
      - dev-net

  database-tools:
    profiles: [tools]
    build:
      context: .
      target: development
    command: ['true']
    environment:
      FVDMS_CONTAINER: '1'
      PNPM_CONFIG_STORE_DIR: /pnpm/store
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_HOST: mysql
      DATABASE_PORT: '3306'
      DATABASE_NAME: fvdms
      DATABASE_USER: fvdms_app
      DATABASE_PASSWORD: local-fvdms-app-password
      DATABASE_POOL_MIN: '1'
      DATABASE_POOL_MAX: '4'
      DATABASE_CONNECT_TIMEOUT_MS: '5000'
      DATABASE_QUERY_TIMEOUT_MS: '2000'
      MIGRATION_DATABASE_USER: fvdms_migrator
      MIGRATION_DATABASE_PASSWORD: local-fvdms-migrator-password
      MYSQL_ADMIN_HOST: mysql
      MYSQL_ADMIN_PORT: '3306'
      MYSQL_ADMIN_USER: root
      MYSQL_ADMIN_PASSWORD: ''
      REPORTING_DATABASE_USER: fvdms_reporter
      REPORTING_DATABASE_PASSWORD: local-fvdms-reporter-password
      AUDIT_DATABASE_NAME: fvdms_audit
      AUDIT_SINK_DATABASE_NAME: fvdms_audit_sink
      AUDIT_WORKER_DATABASE_USER: fvdms_audit_worker
      AUDIT_WORKER_DATABASE_PASSWORD: local-fvdms-audit-worker-password
      AUDIT_SINK_DATABASE_USER: fvdms_audit_sink_writer
      AUDIT_SINK_DATABASE_PASSWORD: local-fvdms-audit-sink-writer-password
      AUDIT_VERIFIER_DATABASE_USER: fvdms_audit_verifier
      AUDIT_VERIFIER_DATABASE_PASSWORD: local-fvdms-audit-verifier-password
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - pnpm-store:/pnpm/store
    networks:
      - dev-net

volumes:
  node-modules:
  pnpm-store:
  next-cache:
  report-exports:

networks:
  dev-net:
    external: true
